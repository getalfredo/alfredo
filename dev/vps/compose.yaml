name: alfredo-vps

# Two fake VPSes: windsor (port 3000) and dover (port 3001).
# Each pair = one dind daemon (the VPS's Docker engine) + one Alfredo instance.

x-dind: &dind
  image: docker:28-dind
  privileged: true
  environment:
    DOCKER_TLS_CERTDIR: ""
  healthcheck:
    test: ["CMD", "docker", "info"]
    interval: 3s
    timeout: 5s
    retries: 20
    start_period: 10s

x-alfredo: &alfredo
  build: .
  restart: unless-stopped

services:
  windsor-dind:
    <<: *dind
    volumes:
      - windsor-dind-data:/var/lib/docker
      # Stacks must be visible at the same path as in the alfredo container,
      # so bind mounts inside managed compose projects resolve correctly.
      - windsor-stacks:/home/alfredo/stacks

  windsor:
    <<: *alfredo
    environment:
      DOCKER_HOST: tcp://windsor-dind:2375
      BETTER_AUTH_URL: http://localhost:${WINDSOR_HTTP_PORT:-3000}
      NODE_ENV: production
    ports:
      - "${WINDSOR_HTTP_PORT:-3000}:3000"
    volumes:
      - ../../dist:/dist:ro
      - windsor-app-data:/home/alfredo/app
      - windsor-stacks:/home/alfredo/stacks
    depends_on:
      windsor-dind:
        condition: service_healthy

  dover-dind:
    <<: *dind
    volumes:
      - dover-dind-data:/var/lib/docker
      - dover-stacks:/home/alfredo/stacks

  dover:
    <<: *alfredo
    environment:
      DOCKER_HOST: tcp://dover-dind:2375
      BETTER_AUTH_URL: http://localhost:${DOVER_HTTP_PORT:-3001}
      NODE_ENV: production
    ports:
      - "${DOVER_HTTP_PORT:-3001}:3000"
    volumes:
      - ../../dist:/dist:ro
      - dover-app-data:/home/alfredo/app
      - dover-stacks:/home/alfredo/stacks
    depends_on:
      dover-dind:
        condition: service_healthy

volumes:
  windsor-dind-data:
  windsor-app-data:
  windsor-stacks:
  dover-dind-data:
  dover-app-data:
  dover-stacks:
